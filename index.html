<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바른 자세 코치 (Posture Coach Web)</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- MediaPipe Pose & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Fullscreen Alert Modal Container -->
  <div id="alert-modal-container"></div>

  <div class="app-container">
    <!-- Header Component -->
    <header id="header-container"></header>

    <!-- Main Dashboard Grid -->
    <main class="dashboard-grid">
      <!-- Left Panel: Webcam & MediaPipe Viewer -->
      <section id="webcam-container"></section>

      <!-- Right Panel: Status & Controls Cards -->
      <section style="display: flex; flex-direction: column; gap: 20px;">
        <div id="status-container"></div>
        <div id="slider-container"></div>
        <div id="serial-container"></div>
      </section>
    </main>
  </div>

  <!-- Modules & Components Scripts -->
  <script src="js/modules/PoseAnalyzer.js"></script>
  <script src="js/modules/MediaPipeManager.js"></script>

  <script src="js/components/HeaderComponent.js"></script>
  <script src="js/components/WebcamComponent.js"></script>
  <script src="js/components/StatusComponent.js"></script>
  <script src="js/components/SliderComponent.js"></script>
  <script src="js/components/SerialComponent.js"></script>
  <script src="js/components/AlertModalComponent.js"></script>

  <!-- Main App Script -->
  <script src="js/app.js"></script>
</body>
</html>
